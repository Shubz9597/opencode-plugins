<style>
  /* Resend-inspired design system: pure black void, frost borders, pill controls */

  details.activity > summary::-webkit-details-marker { display: none; }

  .chip.queued { color: var(--yellow); border-color: rgba(255, 197, 61, 0.34); }
  .queuecard { align-self: flex-start; max-width: 94%; border: 1px dashed rgba(255, 197, 61, 0.5);

                      text-transform: uppercase; letter-spacing: 0.6px; }

  .queuecard .qrow { display: flex; align-items: baseline; gap: 9px; padding: 7px 0 2px; margin-top: 7px;

  /* Composer vertical centering + project chips */

           border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: var(--sans); }
  .pchip.active { color: var(--green); border-color: rgba(17, 255, 153, 0.34); }

                 border-radius: 8px; background: var(--tint); }

  @media (max-width: 520px) {

  @media (pointer: coarse) {
    header button, .composer button, .rbtn, #jump, .pchip { min-height: 44px; }
    .dditem { padding: 14px; }
    .rbtn { min-height: 44px; }
    details.activity > summary, details.activity-tool > summary { min-height: 44px; }

    .pulse, .dots i, #status .dot { animation: none; opacity: .8; }

  }

<body>
<header id="hdr">
  <div class="hrow">
    <span class="brand">opencode <em>remote</em> <span id="projectCur" class="pcur"></span></span>
    <button id="new" title="New session" aria-label="Start a new session">New</button>
    <button id="stop" class="stop" title="Abort current run and pause the queue">Stop</button>
  </div>
  <div class="hrow">
    <button id="sessionBtn" class="ddbtn grow3" title="Switch session" aria-expanded="false" aria-haspopup="true" aria-controls="ddPanel">
      <span class="ddlabel">Session</span>
      <span class="ddvalue"><span id="sessionCur">Loading…</span><span class="chev"> ▼</span></span>
    </button>
    <button id="agentBtn" class="ddbtn grow2" title="Switch agent" aria-expanded="false" aria-haspopup="true" aria-controls="ddPanel">
      <span class="ddlabel">Agent</span>
      <span class="ddvalue"><span id="agentCur">build</span><span class="chev"> ▼</span></span>
    </button>
  </div>
  <div class="hrow">
    <span id="modelPill" class="modelpill" title="Model used by this session; new sessions use opencode's configured default">
      <span class="ddlabel">Model</span><span id="modelCur">…</span>
    </span>
  </div>
  <div id="ddPanel" class="ddpanel"></div>
</header>
<div id="layout">
  <main id="main">
    <div id="scroller" role="region" aria-label="Conversation transcript" tabindex="0"><div id="msgs"></div></div>
    <div id="jumpbar"><button id="jump" aria-label="Jump to latest message">↓ Jump to latest</button></div>
    <footer>
      <div class="foot-inner">
        <div id="requests" role="region" aria-label="Requests needing attention" aria-live="polite"></div>
        <div id="status" aria-live="polite"></div><button id="resume">▶ Resume queue</button>
        <details id="usageMobile"><summary>Session usage</summary><div class="ubody" id="usageMobileBody"></div></details>
        <div id="chips"></div>
        <div class="composer">
          <button id="attach" class="ghost" title="Attach files" aria-label="Attach files">＋</button>
          <label class="sr-only" for="input">Message</label>
          <textarea id="input" rows="1" placeholder="Message or command…" aria-label="Message. Slash commands and exclamation-mark shell commands are supported."></textarea>
          <button id="send">Send</button>
        </div>
        <input type="file" id="file" multiple>
      </div>
    </footer>
  </main>
  <aside id="usagePanel" aria-label="Session usage">
    <h2 class="ushead">Session usage</h2>
    <div id="usageBody"></div>
  </aside>
</div>
<script>
  var TOKEN = __TOKEN__;
  var apiQS = TOKEN ? (window.location.search.indexOf("token=") >= 0 ? window.location.search.replace(/^[?&]/, "") : "token=" + encodeURIComponent(TOKEN)) : "";
  function jsonReq(path, opts) {
    var sep = path.indexOf("?") >= 0 ? "&" : "?";
    return fetch(path + sep + apiQS, Object.assign({ headers: { "content-type": "application/json" } }, opts || {}));
  }
  var sessionBtn = document.getElementById("sessionBtn");
  var agentBtn = document.getElementById("agentBtn");
  var sessionCur = document.getElementById("sessionCur");
  var agentCur = document.getElementById("agentCur");
  var modelCur = document.getElementById("modelCur");
  var projectCur = document.getElementById("projectCur");
  var ddPanel = document.getElementById("ddPanel");
  var scroller = document.getElementById("scroller");
  var msgs = document.getElementById("msgs");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var fileInput = document.getElementById("file");
  var chips = document.getElementById("chips");
  var statusEl = document.getElementById("status");
  var resumeBtn = document.getElementById("resume");
  var requestsEl = document.getElementById("requests");
  var jumpBtn = document.getElementById("jump");
  var usageBody = document.getElementById("usageBody");
  var usageMobileBody = document.getElementById("usageMobileBody");

  // ---- View generation: every request captures the generation it was issued
  // under; responses from an old project/session are discarded instead of
  // overwriting the newly selected one. ----
  var viewGen = 0;
  var current = null, currentTitle = null;
  var agent = "build";
  var sessionList = [], agentList = [];
  var projects = [], activeProject = null;
  var attachments = [];
  var stick = true;
  var pollFailures = 0;

  var domOrder = [];
  var domById = {};
  var contentSig = {};
  var tailDom = null, queueDom = null;
  var busySeen = false;
  var stopRequested = 0;
  var queue = [];            // items: {sessionID, directory, text, agent, attachments}
  var queuePaused = false;
  var flushInFlight = false;
  var replying = {};         // "kind:id" -> true while a reply request is in flight

  // ---- Scroll following: explicit only. Follow mode turns on when the user
  // is at (or returns to) the bottom or presses "Jump to latest" — never on a
  // timer. ----
  function atBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 32; }
  var prevTop = 0;
  // While the user is actively flinging/scrolling (touch or wheel), programmatic
  // scrollTop writes fight the finger and look like hangs — suppress them.
  var userScrollUntil = 0;
  function noteUserScroll() { userScrollUntil = Date.now() + 700; }
  scroller.addEventListener("touchstart", noteUserScroll, { passive: true });
  scroller.addEventListener("touchmove", noteUserScroll, { passive: true });
  scroller.addEventListener("wheel", noteUserScroll, { passive: true });
  function clearReadingRoom() { msgs.style.removeProperty("--reading-room"); }
  function pinActivity(disclosure) {
    if (!disclosure.isConnected || !disclosure.open) return;
    var offset = disclosure.getBoundingClientRect().top - scroller.getBoundingClientRect().top - 12;
    var target = scroller.scrollTop + offset;
    var max = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
    if (target > max) msgs.style.setProperty("--reading-room", Math.ceil(target - max + 1) + "px");
    if (Math.abs(offset) > 1) scroller.scrollTop = target;
    stick = false;
    prevTop = scroller.scrollTop;
    jumpBtn.classList.toggle("show", !atBottom());
  }
  msgs.addEventListener("click", function (e) {
    var summary = e.target && e.target.closest ? e.target.closest("details.activity > summary") : null;
    if (!summary || summary.parentElement.open) return;
    stick = false;
    userScrollUntil = Date.now() + 900;
    requestAnimationFrame(function () { pinActivity(summary.parentElement); });
  }, true);
  // Track accordion/selection interaction per message so renders don't stall taps.
  var interactUntil = {};
  msgs.addEventListener("toggle", function (e) {
    var disclosure = e.target;
    var el = disclosure && disclosure.closest ? disclosure.closest("[data-mid]") : null;
    if (el) interactUntil[el.dataset.mid] = Date.now() + 2000;
    if (!disclosure || !disclosure.matches || !disclosure.matches("details.activity")) return;
    if (!disclosure.open) {
      if (!msgs.querySelector("details.activity[open]")) clearReadingRoom();
      return;
    }

    // Expanding adds content above the final response. Leave follow mode before
    // ResizeObserver can force the viewport back to the bottom, then pin the
    // disclosure header where the reader can start at the beginning.
    stick = false;
    userScrollUntil = Date.now() + 900;
    requestAnimationFrame(function () { pinActivity(disclosure); });
  }, true);
  scroller.addEventListener("scroll", function () {
    var top = scroller.scrollTop;
    if (top < prevTop - 4) { stick = false; }
    else if (atBottom()) { stick = true; }
    prevTop = top;
    jumpBtn.classList.toggle("show", !stick);
  });
  jumpBtn.addEventListener("click", function () {
    stick = true;
    userScrollUntil = 0;
    clearReadingRoom();
    jumpBtn.classList.remove("show");
    scroller.scrollTop = scroller.scrollHeight;
  });
  function scroll() {
    if (!stick) { jumpBtn.classList.toggle("show", !atBottom()); return; }
    scroller.scrollTop = scroller.scrollHeight;
    requestAnimationFrame(function () { if (stick) scroller.scrollTop = scroller.scrollHeight; });
  }

  // Keep the first visible message at its current pixel offset when content
  // above it changes. Existing DOM nodes stay mounted during every refresh.
  function readingAnchor() {
    var edge = scroller.getBoundingClientRect().top;
    var nodes = msgs.querySelectorAll("[data-mid]");
    for (var i = 0; i < nodes.length; i++) {
      var rect = nodes[i].getBoundingClientRect();
      if (rect.bottom > edge) return { node: nodes[i], offset: rect.top - edge };
    }
    return null;
  }
  function restoreReading(anchor, following) {
    var suppressed = Date.now() < userScrollUntil;
    if (following) {
      clearReadingRoom();
      if (!suppressed && !atBottom()) scroller.scrollTop = scroller.scrollHeight;
    } else if (anchor && anchor.node.isConnected) {
      var delta = anchor.node.getBoundingClientRect().top - scroller.getBoundingClientRect().top - anchor.offset;
      // Only correct real drift (>1px); writing scrollTop on every poll is
      // what caused the flicker while scrolling.
      if (!suppressed && Math.abs(delta) > 1) scroller.scrollTop += delta;
    }
    prevTop = scroller.scrollTop;
    stick = following;
    jumpBtn.classList.toggle("show", !following && !atBottom());
  }
  if (window.ResizeObserver) new ResizeObserver(function () {
    if (stick && Date.now() >= userScrollUntil && !atBottom()) {
      scroller.scrollTop = scroller.scrollHeight;
      prevTop = scroller.scrollTop;
    }
  }).observe(msgs);

  function patchNode(old, fresh) {
    if (old.nodeType !== fresh.nodeType || old.nodeName !== fresh.nodeName) { old.replaceWith(fresh); return; }
    if (old.nodeType === 3) { if (old.nodeValue !== fresh.nodeValue) old.nodeValue = fresh.nodeValue; return; }
    if (old.nodeType !== 1) return;
    if (old.dataset.segment && fresh.dataset.segment && old.dataset.segment !== fresh.dataset.segment) { old.replaceWith(fresh); return; }
    Array.from(old.attributes).forEach(function (attr) {
      if (attr.name !== "open" && !fresh.hasAttribute(attr.name)) old.removeAttribute(attr.name);
    });
    Array.from(fresh.attributes).forEach(function (attr) {
      if (attr.name !== "open" && old.getAttribute(attr.name) !== attr.value) old.setAttribute(attr.name, attr.value);
    });
    var next = old.firstChild;
    Array.from(fresh.childNodes).forEach(function (child) {
      if (child.nodeType === 1 && child.dataset.segment) {
        var match = Array.from(old.children).find(function (el) { return el.dataset.segment === child.dataset.segment; });
        if (match && match !== next) { old.insertBefore(match, next); next = match; }
        else if (!match) { old.insertBefore(child, next); return; }
      }
      if (!next) { old.appendChild(child); return; }
      var after = next.nextSibling;
      patchNode(next, child);
      next = after;
    });
    while (next) { var after = next.nextSibling; next.remove(); next = after; }
  }

  function relTime(t) {
    if (!t) return "";
    var d = Math.max(0, Date.now() - t), m = Math.floor(d / 60000);
    if (m < 1) return "now";
    if (m < 60) return m + "m";
    var h = Math.floor(m / 60);
    if (h < 24) return h + "h";
    return Math.floor(h / 24) + "d";
  }

  function fmtDur(ms) {
    if (ms >= 60000) {
      var seconds = Math.round(ms / 1000);
      return Math.floor(seconds / 60) + "m " + (seconds % 60) + "s";
    }
    return (ms / 1000).toFixed(1) + "s";
  }
  function fmtCost(c) { return "$" + Number(c).toFixed(4); }
  function fmtInt(n) { return Math.round(n).toLocaleString("en-US"); }
  function fmtK(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1000) return (n / 1000).toFixed(1) + "K";
    return String(Math.round(n));
  }

  // Media URLs: local attachment endpoints need the token + owning project;
  // remote and data URLs are used as-is (never append the token to them).
  function mediaURL(u) {
    if (/^(data:|https?:)/i.test(u)) return u;
    var sep = u.indexOf("?") >= 0 ? "&" : "?";
    return u + sep + apiQS + "&directory=" + encodeURIComponent(activeProject || "");
  }

  function renderMd(el, text) {
    // `el` is a dedicated per-segment container: markdown overwrites only its
    // own container, never sibling segments or tool/thinking panels.
    if (window.marked && window.DOMPurify) {
      try { el.innerHTML = window.DOMPurify.sanitize(window.marked.parse(text)); enhance(el); return; } catch (e) {}
    }
    var p = document.createElement("span");
    p.style.whiteSpace = "pre-wrap";
    p.textContent = text;
    el.appendChild(p);
  }

  function copyText(text, btn) {
    var done = function (ok) {
      btn.textContent = ok ? "copied ✓" : "copy failed";
      setTimeout(function () { btn.textContent = "copy"; }, 1200);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
    } else {
      done(fallbackCopy(text));
    }
  }
  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  function highlightCode(code) {
    if (!code || code.dataset.highlighted) return;
    var source = code.textContent || "";
    if (!source.trim()) return;
    var keywords = new Set(["async", "await", "break", "case", "catch", "class", "const", "continue", "def", "do", "else", "export", "false", "finally", "for", "from", "function", "if", "import", "in", "interface", "let", "new", "null", "return", "throw", "true", "try", "type", "var", "while"]);
    var pattern = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*|#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\b(?:async|await|break|case|catch|class|const|continue|def|do|else|export|false|finally|for|from|function|if|import|in|interface|let|new|null|return|throw|true|try|type|var|while)\b|\$[A-Za-z_]\w*|\b\d+(?:\.\d+)?\b|(?:=>|===|!==|==|!=|<=|>=|&&|\|\||[{}\[\]();,.?:+\-*\/%=<>]))/gm;

    var cursor = 0, match;

      var span = document.createElement("span");
      var kind = /^\/\*|^\/\/|^#/.test(token) ? "comment"
        : /^["'`]/.test(token) ? "string"
        : keywords.has(token) ? "keyword"
        : /^\$/.test(token) ? "variable"
        : /^\d/.test(token) ? "number" : "operator";
      span.className = "syn-" + kind;
      span.textContent = token;
      fragment.appendChild(span);
      cursor = pattern.lastIndex;
    }
    if (cursor < source.length) fragment.appendChild(document.createTextNode(source.slice(cursor)));
    code.textContent = "";
    code.appendChild(fragment);
    code.dataset.highlighted = "true";
  }

  function enhance(root) {

  function msgDom(m, openState) {

    var toolsOnly = m.segments.length > 0 && m.segments.every(function (s) { return s.type === "tool"; });
    wrap.className = "msg " + m.role + (toolsOnly && m.role === "assistant" ? " tools-only" : "");

    var bubble = document.createElement("div");

    // One quiet cost · duration footer per assistant message. Unknown stays

  function activityIcon(kind) {

      : '<svg viewBox="0 0 16 16"><path d="M8 2.5a4 4 0 0 0-2.5 7.1v1.1h5V9.6A4 4 0 0 0 8 2.5Z"/><path d="M6.5 13h3"/></svg>';

  function toolActivityLabel(name) {
    var key = String(name || "").toLowerCase();
    if (/exec|command|shell|bash|terminal/.test(key)) return "Ran commands";
    if (/patch|edit|write|create/.test(key)) return "Edited files";
    if (/read|grep|glob|search|find/.test(key)) return "Inspected files";
    if (/image|screenshot|browser|view/.test(key)) return "Viewed content";

  }

  function assistantTurnKey(group) {
    var first = group[0];
    return "turn:" + (first ? first.id : "unknown");
  }

  function assistantTurnPlan(group) {
    var assistants = group.filter(function (m) { return m.role === "assistant"; });
    var entries = [];
    assistants.forEach(function (message) {
      message.segments.forEach(function (segment, index) {
        entries.push({ message: message, segment: segment, index: index,
          key: message.id + ":" + (segment.id || index) });
      });
    });
    var running = assistants.some(function (m) { return m.running; });
    var lastText = -1;
    entries.forEach(function (entry, index) {
      if (entry.segment.type === "text") lastText = index;
    });
    var finalEntries = [];
    // OpenCode emits progress/commentary as text parts too. The last completed
    // text part is the user-facing answer; every earlier text part belongs in
    // the activity disclosure with reasoning and tools.
    if (!running && lastText >= 0) finalEntries = [entries[lastText]];
    var finalKeys = new Set(finalEntries.map(function (entry) { return entry.key; }));
    return {
      assistants: assistants,
      running: running,
      finalEntries: finalEntries,
      activityEntries: entries.filter(function (entry) { return !finalKeys.has(entry.key); }),
    };
  }

  function assistantTurnDuration(group, plan) {
    var user = group.find(function (m) { return m.role === "user" && m.time; });
    var start = user ? user.time : (plan.assistants[0] && plan.assistants[0].time);
    if (!start) return null;
    if (plan.running) return Math.max(0, Date.now() - start);
    var end = 0;
    plan.assistants.forEach(function (m) {
      if (m.time && m.durationMs !== null) end = Math.max(end, m.time + m.durationMs);
    });
    return end > 0 ? Math.max(0, end - start) : null;
  }

  function appendTurnAttachments(parent, assistants) {

    if (!files.length) return;
    var box = document.createElement("div");
    box.className = "attach";

        img.src = mediaURL(a.url); img.alt = a.name; img.loading = "lazy";
        box.appendChild(img);
      } else if (a.mime && a.mime.indexOf("video/") === 0) {
        var vid = document.createElement("video");
        vid.src = mediaURL(a.url); vid.controls = true; vid.preload = "metadata";
        box.appendChild(vid);
      } else {
        var chip = document.createElement("a");
        chip.className = "filechip";
        chip.href = mediaURL(a.url); chip.textContent = a.name;
        chip.setAttribute("download", a.name);
        box.appendChild(chip);
      }
    });
    parent.appendChild(box);
  }

  function assistantTurnDom(group, openState) {
    openState = openState || {};
    var key = assistantTurnKey(group);
    var plan = assistantTurnPlan(group);
    var duration = assistantTurnDuration(group, plan);
    var wrap = document.createElement("div");
    wrap.className = "assistant-turn assistant";

    var detailIndex = 0;
    if (plan.activityEntries.length) {
      var activity = document.createElement("details");
      activity.className = "activity";
      activity.dataset.segment = key + ":activity";
      if (openState[key + "#" + detailIndex]) activity.open = true;
      detailIndex++;
      var summary = document.createElement("summary");
      if (plan.running) {
        var pulse = document.createElement("span");
        pulse.className = "pulse";
        summary.appendChild(pulse);
      }
      var label = document.createElement("span");
      label.textContent = (plan.running ? "Working" : "Worked") + (duration !== null ? " for " + fmtDur(duration) : "");
      summary.appendChild(label);
      var chevron = document.createElement("span");
      chevron.className = "activity-chevron";
      summary.appendChild(chevron);
      activity.appendChild(summary);

      var body = document.createElement("div");
      body.className = "activity-body";
      plan.activityEntries.forEach(function (entry) {
        var row = document.createElement("div");
        row.className = "activity-entry activity-" + (entry.segment.type === "text" ? "progress" : entry.segment.type === "thinking" ? "reasoning" : "tool-entry");
        if (entry.segment.type === "tool" && entry.segment.status === "error") row.className += " is-error";
        row.dataset.segment = entry.key;
        row.appendChild(activityIcon(entry.segment.type === "tool" ? "tool" : "thinking"));
        var content = document.createElement("div");
        content.className = "activity-content";
        if (entry.segment.type === "tool") {
          var tool = document.createElement("details");
          tool.className = "activity-tool";
          if (openState[key + "#" + detailIndex]) tool.open = true;
          detailIndex++;
          var toolSummary = document.createElement("summary");
          var toolTitle = document.createElement("span");
          toolTitle.className = "activity-tool-title";
          toolTitle.textContent = toolActivityLabel(entry.segment.name);
          toolSummary.appendChild(toolTitle);
          var toolMeta = document.createElement("span");
          toolMeta.className = "activity-tool-meta";
          var status = entry.segment.status === "completed" ? "Done" : entry.segment.status === "error" ? "Error" : entry.segment.status === "running" || entry.segment.status === "pending" ? "Running" : entry.segment.status;
          toolMeta.textContent = [entry.segment.title, status].filter(Boolean).join(" · ");
          toolSummary.appendChild(toolMeta);
          tool.appendChild(toolSummary);
          if (entry.segment.detail) {
            var toolDetail = document.createElement("div");
            toolDetail.className = "activity-tool-detail";
            var toolCode = document.createElement("code");
            toolCode.textContent = entry.segment.detail;
            highlightCode(toolCode);
            toolDetail.appendChild(toolCode);
            tool.appendChild(toolDetail);
          }
          content.appendChild(tool);
        } else {
          if (entry.segment.type === "thinking") {
            var thoughtLabel = document.createElement("div");
            thoughtLabel.className = "activity-label";
            thoughtLabel.textContent = entry.segment.streaming
              ? "Thinking"
              : entry.segment.durationMs ? "Thought for " + fmtDur(entry.segment.durationMs) : "Reasoning";
            content.appendChild(thoughtLabel);
          }
          var copy = document.createElement("div");
          copy.className = "activity-copy";
          renderMd(copy, entry.segment.text);
          content.appendChild(copy);
        }
        row.appendChild(content);
        body.appendChild(row);
      });
      activity.appendChild(body);
      wrap.appendChild(activity);
    }

    if (plan.finalEntries.length) {
      var final = document.createElement("div");
      final.className = "turn-final";
      plan.finalEntries.forEach(function (entry) {
        var segment = document.createElement("div");
        segment.className = "seg";
        segment.dataset.segment = entry.key;
        renderMd(segment, entry.segment.text);
        final.appendChild(segment);
      });
      wrap.appendChild(final);
    }
    appendTurnAttachments(wrap, plan.assistants);

    if (!plan.running && plan.assistants.length) {
      var totalCost = 0, hasCost = false, input = 0, output = 0;
      plan.assistants.forEach(function (m) {
        if (m.cost !== null) { totalCost += m.cost; hasCost = true; }
        input += m.tokens.input || 0;
        output += m.tokens.output || 0;

      foot.className = "turn-foot";

      }

        elapsed.textContent = fmtDur(duration);
        foot.appendChild(elapsed);
      }
      var usage = document.createElement("span");
      usage.textContent = "↑ " + fmtK(input) + " · ↓ " + fmtK(output);
      foot.appendChild(usage);
      wrap.appendChild(foot);

    return wrap;
  }

  function turnSumDom(group) {
    // Token/context summary only — per-message cost · time lives in the
    // message footer now, so the same numbers don't repeat here.
    var tin = 0, tout = 0, tcache = 0, hasA = false, lastA = null;
    group.forEach(function (m) {

      tin += m.tokens.input;
      tout += m.tokens.output;
      tcache += m.tokens.cacheRead;

    part("↓ <b>" + fmtK(tout) + "</b>");
    part("ctx <b>" + fmtK(ctx) + "</b>");

  function usageRows(u) {
    var rows = [];
    function row(label, value, cls) {

    var none = !u || !u.messages;
    row("Input", none ? null : fmtInt(u.input));

    row("Cached read", none ? null : fmtInt(u.cacheRead));
    row("Cache write", none ? null : fmtInt(u.cacheWrite));
    // A genuine recorded zero is valid; unknown is "—", never a fake zero.
    var costUnknown = !none && u.unknownCost > 0;
    row("Session cost", none || costUnknown ? null : (u.reportedCost > 0 && u.cost === 0 ? fmtCost(u.reportedCost) : fmtCost(u.cost)) + (u.reportedCost > 0 && Math.abs(u.cost - u.reportedCost) > Math.max(0.02 * u.reportedCost, 0.0001) ? " est." : ""), "total");
    return rows;

  function buildQueueCard() {
    var mine = queue.filter(function (p) { return p.sessionID === current && p.directory === activeProject; });
    var card = document.createElement("div");

    head.appendChild(dot);

    lbl.textContent = queuePaused
      ? "Queued · paused — press Resume"
      : "Queued · " + mine.length + " message" + (mine.length !== 1 ? "s" : "") + " — sends when the agent finishes";
    head.appendChild(lbl);
    card.appendChild(head);
    mine.forEach(function (p) {
      var row = document.createElement("div");
      row.className = "qrow";

  function refreshQueue() {
    if (queueDom) { queueDom.remove(); queueDom = null; }
    var mine = queue.filter(function (p) { return p.sessionID === current && p.directory === activeProject; });
    if (!mine.length || !current) return;
    queueDom = buildQueueCard();
    if (tailDom && tailDom.parentNode === msgs) tailDom.appendChild(queueDom);
    else {
      tailDom = document.createElement("div");
      tailDom.appendChild(queueDom);
      msgs.appendChild(tailDom);

  // ---- Blocking request cards (permissions + questions), project-wide ----
  function requestCard(p) {
    var key = p.kind + ":" + p.id;
    var card = document.createElement("div");
    card.className = "rcard" + (p.kind === "question" ? " qcard" : "");
    var head = document.createElement("div");
    head.className = "rhead";
    var kind = document.createElement("span");
    kind.textContent = p.kind === "question" ? "❓ Question" : "⚠ Permission [" + p.type + "]";
    var sess = document.createElement("span");
    sess.className = "rsession";
    sess.textContent = " · " + p.session + (p.sessionID && p.sessionID.length > 6 ? " (" + p.sessionID.slice(-6) + ")" : "");
    head.appendChild(kind); head.appendChild(sess);
    card.appendChild(head);

    var text = document.createElement("div");
    text.className = "rtext";
    text.textContent = p.title || "(no details)";
    card.appendChild(text);
    if (p.patterns && p.patterns.length) {
      var pat = document.createElement("span");
      pat.className = "rpat";
      pat.textContent = p.patterns.join("  ");
      card.appendChild(pat);
    }

    var btns = document.createElement("div");
    btns.className = "rbtns";
    var err = document.createElement("div");
    err.className = "rerr";

    var mkBtn = function (label, cls, fn) {
      var b = document.createElement("button");
      b.className = "rbtn " + cls;
      b.textContent = label;
      b.addEventListener("click", function () {
        if (replying[key]) return;
        replying[key] = true;
        card.querySelectorAll(".rbtn").forEach(function (x) { x.disabled = true; });
        err.textContent = "";
        fn(function (okMsg) {
          delete replying[key];
          if (okMsg) { card.remove(); if (!requestsEl.children.length) requestsEl.classList.remove("on"); }
        }, function (msg) {
          delete replying[key];
          card.querySelectorAll(".rbtn").forEach(function (x) { x.disabled = false; });
          err.textContent = msg;
        });
      });
      return b;
    };
    var post = function (path, body, ok, fail) {
      jsonReq(path + "?directory=" + encodeURIComponent(p.dir || activeProject || ""), { method: "POST", body: JSON.stringify(body) })
        .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
        .then(function (res) { res.ok ? ok(res.b) : fail(res.b && res.b.error ? res.b.error : "request failed"); })
        .catch(function () { fail("network error — the request is still pending"); });
    };

    if (p.kind === "permission") {
      btns.appendChild(mkBtn("Allow once", "once", function (ok, fail) {
        post("/api/permissions", { sessionID: p.sessionID, permissionID: p.id, response: "once" },
          function () { ok("done"); }, fail);
      }));
      btns.appendChild(mkBtn("Always allow", "always", function (ok, fail) {
        post("/api/permissions", { sessionID: p.sessionID, permissionID: p.id, response: "always" },
          function () { ok("done"); }, fail);
      }));
      btns.appendChild(mkBtn("Deny", "deny", function (ok, fail) {
        post("/api/permissions", { sessionID: p.sessionID, permissionID: p.id, response: "reject" },
          function () { ok("done"); }, fail);
      }));
    } else {
      var answers = [];
      (p.questions || [{ question: p.title, options: (p.options || []).map(function (label) { return { label: label }; }) }]).forEach(function (q, qi) {
        var field = document.createElement("fieldset");
        var legend = document.createElement("legend"); legend.textContent = q.question || q.header || "Question"; field.appendChild(legend);
        var choices = [];
        (q.options || []).forEach(function (opt) {
          var label = document.createElement("label"); label.style.display = "block";
          var input = document.createElement("input"); input.type = q.multiple ? "checkbox" : "radio";
          input.name = key + ":" + qi; input.value = opt.label;
          label.appendChild(input); label.appendChild(document.createTextNode(" " + opt.label + (opt.description ? " — " + opt.description : "")));
          field.appendChild(label); choices.push(input);
        });
        var custom = document.createElement("input"); custom.type = "text"; custom.placeholder = "Custom answer…"; custom.setAttribute("aria-label", q.question || "Custom answer");
        if (q.custom !== false) field.appendChild(custom);
        answers.push(function () { var typed = custom.value.trim(); var selected = choices.filter(function (input) { return input.checked; }).map(function (input) { return input.value; }); return typed ? (q.multiple ? selected.concat([typed]) : [typed]) : selected; });
        card.appendChild(field);
      });
      btns.appendChild(mkBtn("Send answers", "always", function (ok, fail) {
        var values = answers.map(function (read) { return read(); });
        if (values.some(function (value) { return !value.length; })) { fail("Please answer each question"); return; }
        post("/api/questions", { sessionID: p.sessionID, questionID: p.id, answers: values }, function () { ok("done"); }, fail);
      }));
      btns.appendChild(mkBtn("Reject", "deny", function (ok, fail) {
        post("/api/questions", { sessionID: p.sessionID, questionID: p.id, reject: true },
          function () { ok("done"); }, fail);
      }));
      card.appendChild(btns);
      card.appendChild(err);
      return card;
    }
    card.appendChild(btns);
    card.appendChild(err);
    return card;
  }

  function renderRequests(attention) {
    var keep = new Set();
    (attention || []).forEach(function (p) {
      var key = p.kind + ":" + p.id;
      keep.add(key);
      var existing = Array.from(requestsEl.children).find(function (el) { return el.dataset.request === key; });
      if (!existing) { var card = requestCard(p); card.dataset.request = key; requestsEl.appendChild(card); }
    });
    Array.from(requestsEl.children).forEach(function (el) { if (!keep.has(el.dataset.request)) el.remove(); });
    requestsEl.classList.toggle("on", !!requestsEl.children.length);
  }

  function contentSignature(m, hot) {
    // Cheap key first: length-based, no JSON cost. Full stringify only for
    // the hot tail (streaming messages), where equal-length edits matter.
    var hash = 2166136261;
    function add(value) {
      value = String(value == null ? "" : value);
      for (var i = 0; i < value.length; i++) hash = Math.imul(hash ^ value.charCodeAt(i), 16777619);
    }
    (m.segments || []).forEach(function (segment) {
      add(segment.id); add(segment.type); add(segment.status); add(segment.text);
      add(segment.title); add(segment.detail); add(segment.streaming); add(segment.durationMs);
    });
    (m.attachments || []).forEach(function (attachment) { add(attachment.name); add(attachment.mime); add(attachment.url); });
    var cheap = [m.cost, m.recordedCost, m.durationMs, m.running, m.model,
      m.tokens && m.tokens.input, m.attachments && m.attachments.length,
      m.segments && m.segments.length, hash >>> 0].join("|");
    if (!hot) return cheap;
    return cheap + "|" + JSON.stringify(m.segments) + JSON.stringify(m.attachments);
  }

  function groupTurns(list) {
    var turns = [];
    list.forEach(function (m) {
      if (m.role === "user" || !turns.length) turns.push([]);
      turns[turns.length - 1].push(m);
    });
    return turns;
  }

  function assistantTurnSignature(group, hot) {
    var assistants = group.filter(function (m) { return m.role === "assistant"; });
    var running = assistants.some(function (m) { return m.running; });
    return assistants.map(function (m) { return contentSignature(m, hot || m.running); }).join("~")
      + (running ? "|tick:" + Math.floor(Date.now() / 1000) : "");
  }

  function renderState(st, gen) {
    if (gen !== viewGen) return; // stale response from a previous selection

    var following = stick;
    var anchor = following ? null : readingAnchor();
    var wanted = [];
    var live = new Set();
    var hot = {};
    st.messages.slice(-3).forEach(function (x) { hot[x.id] = 1; });
    var turns = groupTurns(st.messages);
    turns.forEach(function (group) {
      group.filter(function (m) { return m.role === "user"; }).forEach(function (m) {
        live.add(m.id);
        var sig = contentSignature(m, hot[m.id]);
        var el = domById[m.id];
        if (!el) { el = msgDom(m); el.dataset.mid = m.id; domById[m.id] = el; contentSig[m.id] = sig; }
        else if (contentSig[m.id] !== sig && Date.now() >= (interactUntil[m.id] || 0)) {
          // Skip patching a message the user just tapped an accordion in —
          // the diff stalls the tap; leave sig stale, next poll updates it.
          var fresh = msgDom(m, captureOpen(m.id)); fresh.dataset.mid = m.id;
          patchNode(el, fresh);
          contentSig[m.id] = sig;
        }
        wanted.push(el);
      });

      var assistants = group.filter(function (m) { return m.role === "assistant"; });
      if (assistants.length) {
        var turnKey = assistantTurnKey(group);
        live.add(turnKey);
        var turnHot = assistants.some(function (m) { return !!hot[m.id] || m.running; });
        var turnSig = assistantTurnSignature(group, turnHot);
        var turnEl = domById[turnKey];
        if (!turnEl) {
          turnEl = assistantTurnDom(group);
          turnEl.dataset.mid = turnKey;
          domById[turnKey] = turnEl;
          contentSig[turnKey] = turnSig;
        } else if (contentSig[turnKey] !== turnSig && Date.now() >= (interactUntil[turnKey] || 0)) {
          var freshTurn = assistantTurnDom(group, captureOpen(turnKey));
          freshTurn.dataset.mid = turnKey;
          patchNode(turnEl, freshTurn);
          contentSig[turnKey] = turnSig;
        }
        wanted.push(turnEl);
      }
    });
    if (!st.messages.length) wanted.push(msgs.querySelector(".empty") || emptyDom());
    Object.keys(domById).forEach(function (id) { if (!live.has(id)) { delete domById[id]; delete contentSig[id]; } });
    domOrder = wanted.map(function (el) { return el.dataset.mid || ""; }).filter(Boolean);
    if (!tailDom) tailDom = document.createElement("div");
    wanted.push(tailDom);
    var cursor = msgs.firstChild;
    wanted.forEach(function (el) {
      if (el === cursor) cursor = cursor.nextSibling;
      else msgs.insertBefore(el, cursor);
    });
    while (cursor) { var next = cursor.nextSibling; cursor.remove(); cursor = next; }
    refreshQueue();
    renderUsage(st.usage);
    renderRequests(st.attention);
    restoreReading(anchor, following);
    requestAnimationFrame(function () { if (gen === viewGen && stick === following) restoreReading(anchor, following); });

    // Model pill reflects THIS session's latest assistant model only.
    for (var i = st.messages.length - 1; i >= 0; i--) {
      if (st.messages[i].role === "assistant" && st.messages[i].model) {
        modelCur.textContent = st.messages[i].model.split("/").slice(1).join("/");
        break;
      }
    }

    var lastTool = "";
    for (var j = st.messages.length - 1; j >= 0 && !lastTool; j--) {
      var segs = st.messages[j].segments;
      for (var k = segs.length - 1; k >= 0; k--) {
        if (segs[k].type === "tool") { lastTool = segs[k].name + (segs[k].status === "error" ? " (error)" : ""); break; }
      }
    }

    if (st.status === "busy") busySeen = true;
    if (st.status === "idle") {
      if (stopRequested && Date.now() - stopRequested < 6000) {
        stopRequested = 0;
        showStatus("", "");
        statusEl.className = "on";
        statusEl.innerHTML = "Stopped ✓" + (queuePaused && queue.length ? " — queue paused" : "");
        setTimeout(function () { statusEl.className = ""; statusEl.innerHTML = ""; }, 2500);
        return;
      }
      if (busySeen) {
        busySeen = false;
        if (!queuePaused) { flushQueue(); }
      }
    }
    if (st.status === "busy") {
      // kind "on" makes the chip visible (#status is display:none by default).
      showStatus("on", '<span class="dots"><i></i><i></i><i></i></span> Working' + (lastTool ? " · " + lastTool : "") + "…");
    } else if (st.status === "retry") {
      showStatus("retry", '<span class="dots"><i></i><i></i><i></i></span> Retrying…');
    } else {
      // idle, or unknown from a failed status read — the poll catch shows
      // "Reconnecting…" after repeated failures, so don't fake a retry here.
      showStatus("", "");
    }
    if (st.attentionError) { showStatus("retry", ""); statusEl.textContent = st.attentionError; }
  }

  var pollActive = null;
  var pollAgain = false;
  function poll() {
    if (pollActive === viewGen) { pollAgain = true; return; }
    if (!current) {
      if (!msgs.querySelector(".empty")) { msgs.textContent = ""; msgs.appendChild(emptyDom()); }
      renderUsage(null);
      showStatus("", "");
    }
    var gen = viewGen;
    pollActive = gen;
    var path = current ? "/api/state?sessionID=" + encodeURIComponent(current) + "&" : "/api/attention?";
    jsonReq(path + "directory=" + encodeURIComponent(activeProject || ""))
      .then(function (r) { if (!r.ok) throw new Error("State unavailable"); return r.json(); })
      .then(function (st) {
        if (gen !== viewGen) return;
        pollFailures = 0;
        if (statusEl.classList.contains("retry") && statusEl.innerHTML.indexOf("Reconnecting") >= 0) showStatus("", "");
        if (current) renderState(st, gen);
        else renderRequests(st);
      })
      .catch(function () {
        if (gen !== viewGen) return;
        pollFailures++;
        if (pollFailures >= 2) showStatus("retry", '<span class="dots"><i></i><i></i><i></i></span> Reconnecting…');
      }).finally(function () {
      if (pollActive !== gen) return;
      pollActive = null;
      if (pollAgain) { pollAgain = false; poll(); }
    });
  }

  // ---- SSE live events: trigger instant refreshes, poll stays as fallback ----
  var lastTrigger = 0;
  function schedulePoll(force) {
    var now = Date.now();
    if (!force && now - lastTrigger < 250) return;
    lastTrigger = now;
    poll();
  }
  function startSSE() {
    if (!window.EventSource) return;
    var es = new EventSource("/api/events" + (apiQS ? "?" + apiQS : ""));
    es.onmessage = function (e) {
      try {
        var evt = JSON.parse(e.data);
        if (evt.type === "session.idle" && evt.sessionID === current && !queuePaused) setTimeout(flushQueue, 600);
        maybeRefreshList(evt.type);
        if (evt.sessionID && evt.sessionID !== current && evt.type.indexOf("permission") !== 0 && evt.type.indexOf("question") !== 0) return;
        schedulePoll(evt.type === "session.idle" || evt.type === "permission.updated" || evt.type === "question.updated");
      } catch (err) {}
    };
    es.onerror = function () { /* EventSource auto-reconnects; polling covers gaps */ };
  }

  function resetView() {
    viewGen++;
    tailDom = null;
    queueDom = null;
    domOrder = [];
    domById = {};
    contentSig = {};
    clearReadingRoom();
    msgs.textContent = "";
    requestsEl.dataset.sig = "";
    renderRequests([]);
    busySeen = false;
    pollFailures = 0;
  }

  function setSession(id, title) {
    var changed = current !== (id || null);
    current = id || null;
    currentTitle = title || null;
    sessionCur.textContent = title || "New session";
    updateProjectLabel();
    if (changed) { resetView(); stick = true; }
    closeDD();
    poll();
  }

  function updateProjectLabel() {
    var p = projects.find(function (x) { return x.directory === activeProject; });
    projectCur.textContent = p ? p.name : (activeProject ? activeProject.split("/").pop() : "");
  }

  function loadProjects(thenRun) {
    jsonReq("/api/projects").then(function (r) { return r.json(); }).then(function (list) {
      projects = list || [];
      if (!projects.some(function (p) { return p.directory === activeProject; })) {
        activeProject = projects.length ? projects[0].directory : null;
      }
      if (thenRun) thenRun();
    }).catch(function () { if (thenRun) thenRun(); });
  }

  function refreshSessions(keepId) {
    var gen = viewGen;
    jsonReq("/api/sessions?directory=" + encodeURIComponent(activeProject || "")).then(function (r) { return r.json(); }).then(function (list) {
      if (gen !== viewGen) return;
      sessionList = list || [];
      var found = null;
      var wanted = keepId !== undefined ? keepId : current;
      sessionList.forEach(function (s) { if (s.id === wanted) found = s; });
      // No explicit target (project switch / startup): auto-open the most
      // recent session — that's the one likely running.
      if (!found && keepId === undefined && sessionList.length) found = sessionList[0];
      setSession(found ? found.id : null, found ? found.title : null);
    });
  }

  // ---- Accordion dropdowns ----
  function closeDD() {
    ddPanel.classList.remove("open");
    ddPanel.innerHTML = "";
    sessionBtn.setAttribute("aria-expanded", "false");
    agentBtn.setAttribute("aria-expanded", "false");
  }
  function renderSessionPanel() {
    ddPanel.dataset.kind = "session";
    ddPanel.textContent = "";
    var head = document.createElement("div");
    head.className = "ddhead";
    head.textContent = "Projects";
    ddPanel.appendChild(head);

    var prow = document.createElement("div");
    prow.className = "prow";
    projects.forEach(function (p) {
      var chip = document.createElement("button");
      chip.className = "pchip" + (p.directory === activeProject ? " active" : "");
      chip.textContent = p.name;
      chip.title = p.sessions + " session" + (p.sessions === 1 ? "" : "s");
      chip.addEventListener("click", function () {
        if (activeProject === p.directory) return;
        activeProject = p.directory;
        resetView();
        updateProjectLabel();
        loadMeta();
        refreshSessions();
      });
      prow.appendChild(chip);
    });
    ddPanel.appendChild(prow);

    var activeName = (projects.find(function (p) { return p.directory === activeProject; }) || {}).name || "project";
    var head2 = document.createElement("div");
    head2.className = "ddhead";
    head2.textContent = "Sessions in " + activeName;
    ddPanel.appendChild(head2);

    var newRow = document.createElement("button");
    newRow.className = "dditem" + (current ? "" : " active");
    newRow.innerHTML = '<span class="t">＋ New session</span>';
    newRow.addEventListener("click", function () { setSession(null, null); });
    ddPanel.appendChild(newRow);

    sessionList.forEach(function (s) {
      var item = document.createElement("button");
      item.className = "dditem" + (s.id === current ? " active" : "");
      var t = document.createElement("span");
      t.className = "t";
      t.textContent = (s.parentID ? "↳ " : "") + (s.title || s.id);
      var sub = document.createElement("span");
      sub.className = "sub";
      sub.textContent = relTime(s.updated) + " ago · " + s.id.slice(-6) + (s.parentID ? " · subagent" : "");
      item.appendChild(t); item.appendChild(sub);
      item.addEventListener("click", function () { setSession(s.id, s.title); });
      ddPanel.appendChild(item);
    });
    ddPanel.classList.add("open");
  }

  function toggleDD(kind) {
    if (ddPanel.classList.contains("open") && ddPanel.dataset.kind === kind) { closeDD(); return; }
    ddPanel.textContent = "";
    sessionBtn.setAttribute("aria-expanded", kind === "session" ? "true" : "false");
    agentBtn.setAttribute("aria-expanded", kind === "agent" ? "true" : "false");
    if (kind === "session") { renderSessionPanel(); return; }
    ddPanel.dataset.kind = kind;
    var head = document.createElement("div");
    head.className = "ddhead";
    head.textContent = "Agents — tap to switch";
    ddPanel.appendChild(head);
    agentList.forEach(function (a) {
      var item = document.createElement("button");
      item.className = "dditem" + (a.name === agent ? " active" : "");
      var t = document.createElement("span");
      t.className = "t";
      t.textContent = a.name;
      var sub = document.createElement("span");
      sub.className = "sub";
      sub.textContent = a.description || a.mode || "";
      item.appendChild(t); item.appendChild(sub);
      item.addEventListener("click", function () {
        agent = a.name;
        agentCur.textContent = a.name;
        closeDD();
      });
      ddPanel.appendChild(item);
    });
    ddPanel.classList.add("open");
  }
  sessionBtn.addEventListener("click", function (e) { e.stopPropagation(); toggleDD("session"); });
  agentBtn.addEventListener("click", function (e) { e.stopPropagation(); toggleDD("agent"); });
  document.addEventListener("click", function (e) {
    if (!ddPanel.contains(e.target)) closeDD();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && ddPanel.classList.contains("open")) closeDD();
  });

  function loadMeta() {
    jsonReq("/api/meta?directory=" + encodeURIComponent(activeProject || "")).then(function (r) { return r.json(); }).then(function (meta) {
      agentList = meta.agents || [];
      if (!agentList.some(function (a) { return a.name === agent; })) {
        agent = meta.defaultAgent || agentList[0]?.name || "build";
      }
      agentCur.textContent = agent;
      // Default model is a placeholder until this session's own messages
      // provide the real model (renderState updates it from the transcript).
    }).catch(function () {});
  }

  function addChips() {
    chips.textContent = "";
    attachments.forEach(function (a, i) {
      var chip = document.createElement("span");
      chip.className = "chip";
      if (a.dataUrl && a.mime.indexOf("image/") === 0) {
        var img = document.createElement("img");
        img.src = a.dataUrl;
        chip.appendChild(img);
      }
      var label = document.createElement("span");
      label.textContent = a.name;
      chip.appendChild(label);
      var x = document.createElement("button");
      x.textContent = "×";
      x.setAttribute("aria-label", "Remove attachment " + a.name);
      x.addEventListener("click", function () { attachments.splice(i, 1); addChips(); });
      chip.appendChild(x);
      chips.appendChild(chip);
    });
  }

  // ---- Queue: items own their project/session identity and are dispatched
  // with that identity, never the currently selected project. Draining is
  // serialized; Stop pauses the queue until an explicit Resume. ----
  function doSend(payload, isQueued) {
    sendBtn.disabled = true;
    jsonReq("/api/send?directory=" + encodeURIComponent(payload.directory || activeProject || ""), { method: "POST", body: JSON.stringify(payload) })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (res) {
        if (!res.ok) {
          if (res.b && res.b.error && res.b.error.indexOf("busy") >= 0) {
            queue.push(payload);
            refreshQueue();
          } else if (isQueued) {
            queue.unshift(payload); // keep queued work visible for retry
            refreshQueue();
            alert(res.b && res.b.error ? res.b.error : "send failed");
          } else {
            // Restore the failed draft instead of losing it.
            input.value = payload.text || "";
            attachments = (payload.attachments || []).map(function (a) {
              return { name: a.name, mime: a.mime, b64: a.data, dataUrl: a.mime && a.mime.indexOf("image/") === 0 ? "data:" + a.mime + ";base64," + a.data : null };
            });
            addChips();
            alert(res.b && res.b.error ? res.b.error : "send failed");
          }
        }
        else {
          if (current !== res.b.sessionID) refreshSessions(res.b.sessionID);
          else setTimeout(poll, 250);
        }
      })
      .catch(function () {
        if (isQueued) { queue.unshift(payload); refreshQueue(); }
        else {
          input.value = payload.text || "";
          attachments = (payload.attachments || []).map(function (a) {
            return { name: a.name, mime: a.mime, b64: a.data, dataUrl: a.mime && a.mime.indexOf("image/") === 0 ? "data:" + a.mime + ";base64," + a.data : null };
          });
          addChips();
          alert("network error — draft restored");
        }
      })
      .finally(function () { sendBtn.disabled = false; });
  }

  function flushQueue() {
    if (flushInFlight || queuePaused || !queue.length) return;
    var next = queue.shift();
    flushInFlight = true;
    refreshQueue();
    var done = function () { flushInFlight = false; };
    // Dispatch with the item's own identity, then re-enable draining.
    sendBtn.disabled = true;
    jsonReq("/api/send?directory=" + encodeURIComponent(next.directory || ""), { method: "POST", body: JSON.stringify(next) })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (res) {
        if (!res.ok) {
          queue.unshift(next);
          refreshQueue();
          if (!(res.b && res.b.error && res.b.error.indexOf("busy") >= 0)) alert(res.b && res.b.error ? res.b.error : "queued send failed");
        } else if (current !== res.b.sessionID) {
          refreshSessions(res.b.sessionID);
        } else {
          setTimeout(poll, 250);
        }
      })
      .catch(function () {
        queue.unshift(next);
        refreshQueue();
        alert("network error — queued message kept for retry");
      })
      .finally(function () { sendBtn.disabled = false; done(); });
  }

  function send() {
    if (sendBtn.disabled) return;
    var text = input.value.trim();
    if (!text && !attachments.length) return;
    var payload = {
      sessionID: current,
      directory: activeProject,
      text: text,
      agent: agent,
      attachments: attachments.map(function (a) { return { name: a.name, mime: a.mime, data: a.b64 }; })
    };
    // Clear the composer only after building the payload; doSend restores it
    // on failure.
    input.value = "";
    input.style.height = "auto";
    attachments = []; addChips();
    stick = true; // always follow your own message
    userScrollUntil = 0;
    clearReadingRoom();
    jumpBtn.classList.remove("show");
    doSend(payload, false);
  }

  var MAX_FILE_BYTES = 20 * 1024 * 1024;
  function addFile(f) {
    if (f.size > MAX_FILE_BYTES) {
      alert("File too large (max 20MB): " + (f.name || "file"));
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      var result = String(reader.result || "");
      var comma = result.indexOf(",");
      attachments.push({ name: f.name || "pasted-" + Date.now() + ".png", mime: f.type || "application/octet-stream", b64: comma >= 0 ? result.slice(comma + 1) : result, dataUrl: result });
      addChips();
    };
    reader.onerror = function () { alert("Could not read file: " + (f.name || "file")); };
    reader.readAsDataURL(f);
  }

  fileInput.addEventListener("change", function () {
    Array.prototype.forEach.call(fileInput.files, addFile);
    fileInput.value = "";
  });
  document.getElementById("attach").addEventListener("click", function () { fileInput.click(); });

  // Ctrl+V / long-press paste — works over http; images arrive as file items.
  document.addEventListener("paste", function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var added = false;
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file") {
        var f = items[i].getAsFile();
        if (f) { addFile(f); added = true; }
      }
    }
    if (added) e.preventDefault();
  });

  // Drag & drop files onto the chat area.
  var dropTimer = null;
  window.addEventListener("dragover", function (e) { e.preventDefault(); scroller.classList.add("dropzone"); clearTimeout(dropTimer); dropTimer = setTimeout(function () { scroller.classList.remove("dropzone"); }, 300); });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    scroller.classList.remove("dropzone");
    if (e.dataTransfer && e.dataTransfer.files) Array.prototype.forEach.call(e.dataTransfer.files, addFile);
  });

  document.getElementById("new").addEventListener("click", function () { setSession(null, null); input.focus(); });
  document.getElementById("stop").addEventListener("click", function () {
    if (!current) return;
    // Stop pauses queued work; nothing drains until an explicit Resume.
    if (queue.length) queuePaused = true;
    resumeBtn.classList.toggle("show", queuePaused && queue.length > 0);
    stopRequested = Date.now();
    showStatus("on", '<span class="dots"><i></i><i></i><i></i></span> Stopping…');
    jsonReq("/api/abort?directory=" + encodeURIComponent(activeProject || ""), { method: "POST", body: JSON.stringify({ sessionID: current }) })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (res) {
        if (!res.ok && res.b && res.b.error) alert(res.b.error);
      })
      .catch(function () {});
    setTimeout(poll, 600);
    setTimeout(poll, 1500);
  });
  resumeBtn.addEventListener("click", function () {
    queuePaused = false;
    resumeBtn.classList.remove("show");
    refreshQueue();
    flushQueue();
  });
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    // Don't send mid-composition (IME) or while a send is already in flight.
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      send();
    }
  });
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  // Refresh session picker on background session activity (created/updated/
  // deleted events arrive via SSE).
  var lastListRefresh = 0;
  function maybeRefreshList(evtType) {
    if (evtType !== "session.created" && evtType !== "session.updated" && evtType !== "session.deleted") return;
    var now = Date.now();
    if (now - lastListRefresh < 2000) return;
    lastListRefresh = now;
    jsonReq("/api/sessions?directory=" + encodeURIComponent(activeProject || "")).then(function (r) { return r.json(); }).then(function (list) {
      sessionList = list || [];
      var found = null;
      sessionList.forEach(function (s) { if (s.id === current) found = s; });
      if (found && found.title !== currentTitle) { currentTitle = found.title; sessionCur.textContent = found.title; }
    }).catch(function () {});
  }

  loadProjects(function () {
    loadMeta();
    refreshSessions();
  });
  startSSE();
  setInterval(poll, 1500);
</script>
</body>
</html>
