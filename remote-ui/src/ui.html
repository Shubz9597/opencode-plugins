<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>opencode remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  /* Resend-inspired design system: pure black void, frost borders, pill controls */
  :root {
    color-scheme: dark;
    --bg: #000000;
    --text: #f0f0f0;
    --dim: #a1a4a5;
    --faint: #464a4d;
    --frost: rgba(214, 235, 253, 0.19);
    --frost-alt: rgba(217, 237, 254, 0.145);
    --ring: rgba(176, 199, 217, 0.145) 0px 0px 0px 1px;
    --hover: rgba(255, 255, 255, 0.28);
    --tint: rgba(255, 255, 255, 0.04);
    --orange: #ffa057;
    --orange-deep: #ff801f;
    --green: #11ff99;
    --blue: #3b9eff;
    --yellow: #ffc53d;
    --red: #ff2047;
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --mono: ui-monospace, "Commit Mono", "Cascadia Code", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; height: 100dvh; font-size: 15px;
         -webkit-font-smoothing: antialiased; }

  header { display: flex; flex-direction: column; gap: 7px; padding: 10px 12px;
           background: rgba(0,0,0,0.88); backdrop-filter: blur(12px);
           border-bottom: 1px solid var(--frost); position: sticky; top: 0; z-index: 5; }
  .hrow { display: flex; gap: 6px; align-items: center; width: 100%; }
  .brand { font-family: var(--serif); font-weight: 400; font-size: 17px; letter-spacing: -0.4px;
           color: var(--text); margin-right: auto; }
  .brand em { font-style: normal; color: var(--faint); }
  header button { background: transparent; color: var(--text); border: 1px solid var(--frost);
                  border-radius: 9999px; padding: 8px 14px; font-size: 12.5px; font-weight: 500;
                  cursor: pointer; font-family: var(--sans); }
  header button:hover { background: var(--hover); }
  header button.stop { color: var(--red); border-color: rgba(255, 32, 71, 0.34); }

  .grow3 { flex: 3 1 0; }
  .grow2 { flex: 2 1 0; }
  .ddbtn { min-width: 0; text-align: left; display: flex; flex-direction: column;
           gap: 1px; padding: 6px 14px !important; }
  .ddbtn .ddlabel { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px;
                    color: var(--faint); }
  .ddbtn .ddvalue { display: block; font-size: 13px; color: var(--text); white-space: nowrap;
                    overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .ddbtn .ddvalue .chev { color: var(--faint); font-size: 9px; }
  .modelpill { flex: 1 1 auto; min-width: 0; border: 1px solid var(--frost-alt); border-radius: 9999px;
               padding: 5px 14px; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; text-align: left; font-family: var(--mono); }
  .modelpill .ddlabel { display: inline-block; font-family: var(--sans); font-size: 10px;
                        text-transform: uppercase; letter-spacing: 0.6px; color: var(--faint);
                        margin-right: 8px; }

  .ddpanel { position: absolute; left: 10px; right: 10px; top: calc(100% + 2px);
             background: rgba(0, 0, 0, 0.97); border: 1px solid var(--frost); border-radius: 16px;
             box-shadow: var(--ring); max-height: 340px; overflow-y: auto; display: none; z-index: 50; }
  .ddpanel.open { display: block; }
  .ddhead { padding: 10px 14px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px;
            color: var(--faint); }
  .dditem { padding: 12px 14px; border-top: 1px solid var(--frost-alt); cursor: pointer;
            display: flex; flex-direction: column; gap: 2px; }
  .dditem:first-of-type { border-top: 0; }
  .dditem:hover, .dditem:active { background: var(--hover); }
  .dditem .t { font-size: 13.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .dditem.active .t { color: var(--green); }
  .dditem.active .t::after { content: " ✓"; }
  .dditem .sub { font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }

  #banner { background: rgba(255, 197, 61, 0.08); color: var(--yellow); padding: 9px 14px;
            font-size: 13.5px; display: none; align-items: center; gap: 8px; flex-wrap: wrap;
            border-bottom: 1px solid var(--frost); }
  #banner button { border: 1px solid var(--frost); background: transparent; border-radius: 9999px;
                   padding: 5px 13px; font-size: 12.5px; cursor: pointer; font-weight: 500; }
  #banner button.once { color: var(--green); border-color: rgba(17, 255, 153, 0.34); }
  #banner button.always { color: var(--blue); border-color: rgba(59, 158, 255, 0.34); }
  #banner button.deny { color: var(--red); border-color: rgba(255, 32, 71, 0.34); }
  #banner button:hover { background: var(--hover); }

  #scroller { flex: 1; overflow-y: auto; }
  #msgs { max-width: 820px; margin: 0 auto; padding: 20px 16px 32px; display: flex;
          flex-direction: column; gap: 18px; }
  .msg { display: flex; flex-direction: column; gap: 6px; animation: fadein .18s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .who { display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; color: var(--faint);
         padding: 0 6px; letter-spacing: 0.3px; text-transform: uppercase; }
  .who .name { font-weight: 500; font-size: 11.5px; }
  .msg.user .who .name { color: var(--orange); }
  .msg.assistant .who .name { color: var(--blue); text-transform: none; letter-spacing: 0; }
  .msg.user { align-items: flex-end; }
  .msg.user .who { flex-direction: row-reverse; }
  .bubble { max-width: 94%; padding: 12px 16px; border-radius: 16px; word-break: break-word;
            font-size: 14.5px; line-height: 1.55; }
  .msg.user .bubble { background: rgba(255, 89, 0, 0.12); border: 1px solid rgba(255, 128, 31, 0.35);
                      color: var(--text); white-space: pre-wrap; }
  .msg.assistant .bubble { background: transparent; border: 1px solid var(--frost); }
  .assistant p { margin: .5em 0; } .assistant p:first-child { margin-top: 0; }
  .assistant p:last-child { margin-bottom: 0; }
  .assistant h1, .assistant h2, .assistant h3 { margin: .8em 0 .35em; line-height: 1.25; }
  .assistant h1 { font-size: 1.3em; } .assistant h2 { font-size: 1.18em; } .assistant h3 { font-size: 1.06em; }
  .assistant ul, .assistant ol { margin: .5em 0; padding-left: 1.35em; }
  .assistant li { margin: .25em 0; }
  .assistant blockquote { margin: .5em 0; padding: 2px 14px; border-left: 2px solid var(--frost);
                          color: var(--dim); }
  .assistant a { color: var(--blue); }
  .assistant hr { border: 0; border-top: 1px solid var(--frost); margin: .9em 0; }
  .assistant table { border-collapse: collapse; margin: .6em 0; font-size: .93em; display: block; overflow-x: auto; }
  .assistant td, .assistant th { border: 1px solid var(--frost); padding: 5px 10px; text-align: left; }
  .assistant code { font-family: var(--mono); font-size: .9em; background: rgba(255,255,255,0.05);
                    border: 1px solid var(--frost-alt); border-radius: 4px; padding: 1px 5px; }
  .assistant pre { background: rgba(255,255,255,0.02); border: 1px solid var(--frost); border-radius: 16px;
                   padding: 14px 16px; overflow-x: auto; position: relative; margin: .6em 0; }
  .assistant pre code { background: none; border: 0; padding: 0; font-size: 12.8px; line-height: 1.55; }
  .assistant img { max-width: 100%; border-radius: 12px; }
  pre .copy { position: absolute; top: 8px; right: 8px; background: transparent; color: var(--dim);
              border: 1px solid var(--frost); border-radius: 9999px; font-size: 11px; padding: 2px 10px;
              cursor: pointer; opacity: 0; transition: opacity .12s; font-family: var(--sans); }
  pre:hover .copy { opacity: 1; }
  pre .copy:hover { background: var(--hover); color: var(--text); }

  details.thinking { background: rgba(255,255,255,0.02); border: 1px solid var(--frost-alt);
                     border-radius: 12px; margin: 2px 0 8px; overflow: hidden; }
  details.thinking summary { cursor: pointer; color: var(--dim); font-size: 12.5px; padding: 8px 13px;
                             user-select: none; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.thinking summary::-webkit-details-marker { display: none; }
  details.thinking summary .chev { transition: transform .15s; display: inline-block; font-size: 9px; }
  details.thinking[open] summary .chev { transform: rotate(90deg); }
  details.thinking summary:hover { color: var(--text); }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--green);
           animation: pulse 1.1s ease-in-out infinite; flex: 0 0 auto; }
  @keyframes pulse { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  .tbody { padding: 6px 14px 11px; font-size: 13px; color: var(--dim); white-space: pre-wrap;
           max-height: 300px; overflow-y: auto; border-top: 1px solid var(--frost-alt); padding-top: 9px; }

  details.tool { background: transparent; border: 1px solid var(--frost-alt); border-radius: 12px;
                 max-width: 94%; overflow: hidden; }
  details.tool summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 7px;
                         padding: 6px 13px; font-family: var(--mono); font-size: 12.5px; color: var(--dim);
                         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  details.tool summary::-webkit-details-marker { display: none; }
  details.tool summary .tname { color: var(--orange); font-weight: 500; }
  details.tool summary .chev { color: var(--faint); font-size: 9px; margin-left: auto; }
  details.tool summary:hover { color: var(--text); }
  details.tool .tdetail { padding: 7px 13px 10px; color: var(--faint); font-family: var(--mono);
                          font-size: 11.5px; line-height: 1.5; white-space: pre-wrap;
                          word-break: break-word; max-height: 220px; overflow-y: auto;
                          border-top: 1px solid var(--frost-alt); }
  .meta { display: flex; gap: 8px; font-size: 11px; color: var(--faint); padding: 0 6px; }
  .meta .cost { color: var(--green); }
  .attach { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .attach img { max-width: 240px; max-height: 240px; border-radius: 12px; display: block;
                border: 1px solid var(--frost); }
  .attach video { max-width: 260px; max-height: 260px; border-radius: 12px; display: block;
                  border: 1px solid var(--frost); background: #000; }
  .attach .filechip { background: transparent; border: 1px solid var(--frost); color: var(--dim);
                      border-radius: 9999px; padding: 6px 14px; font-size: 12.5px; text-decoration: none; }
  .attach .filechip:hover { background: var(--hover); color: var(--text); }
  .msg.tools-only .bubble { background: transparent; border: 0; padding: 0; display: flex;
                            flex-direction: column; gap: 5px; }
  .dropzone { outline: 1px dashed var(--frost); outline-offset: -8px; border-radius: 16px; }
  .turnsum { align-self: center; display: flex; gap: 12px; font-family: var(--mono); font-size: 11px;
             color: var(--faint); border-top: 1px solid var(--frost-alt); padding: 7px 10px 0;
             margin-top: 2px; width: 100%; justify-content: center; flex-wrap: wrap; }
  .turnsum span b { color: var(--dim); font-weight: 500; }
  .turnsum .c { color: var(--green); }
  .empty { margin: auto; text-align: center; color: var(--dim); padding: 40px 20px; }
  .empty .logo { font-size: 40px; margin-bottom: 12px; color: var(--faint); }
  .empty h1 { font-family: var(--serif); font-weight: 400; font-size: 30px; letter-spacing: -0.5px;
              color: var(--text); margin: 0 0 8px; }
  .empty p { margin: 4px 0; font-size: 14px; }
  .empty .hint { font-size: 12px; color: var(--faint); }

  footer { background: rgba(0,0,0,0.88); backdrop-filter: blur(12px);
           border-top: 1px solid var(--frost); padding: 10px 14px 12px; }
  .foot-inner { max-width: 820px; margin: 0 auto; }
  #status { font-size: 11.5px; min-height: 17px; padding: 1px 4px 6px; color: var(--green);
            letter-spacing: 0.3px; }
  #status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 7px;
                 animation: pulse 1.2s ease-in-out infinite; }
  #status.retry { color: var(--yellow); }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
  #chips:empty { display: none; }
  .chip { background: var(--tint); border: 1px solid var(--frost); border-radius: 9999px; padding: 4px 10px;
          font-size: 12.5px; display: flex; gap: 7px; align-items: center; color: var(--dim); }
  .chip img { height: 28px; border-radius: 5px; }
  .chip button { background: none; border: 0; color: var(--red); cursor: pointer; font-size: 14px; padding: 0 2px; }
  .composer { display: flex; gap: 8px; align-items: flex-end; background: transparent;
              border: 1px solid var(--frost); border-radius: 24px; padding: 8px; }
  .composer:focus-within { box-shadow: var(--ring); }
  textarea { flex: 1; resize: none; background: transparent; color: var(--text); border: 0; outline: none;
             padding: 8px 6px; font-size: 15px; font-family: var(--sans); max-height: 160px; line-height: 1.45; }
  textarea::placeholder { color: var(--faint); }
  .composer button { background: transparent; color: var(--text); border: 1px solid var(--frost);
                     border-radius: 9999px; padding: 8px 14px; font-size: 13.5px; cursor: pointer;
                     font-weight: 500; }
  .composer button:hover { background: var(--hover); }
  .composer button#send { background: #ffffff; color: #000000; border-color: #ffffff; }
  .composer button#send:hover { background: rgba(255,255,255,0.85); }
  .composer button:disabled { opacity: .4; }
  input[type="file"] { display: none; }

  /* Boxes, not pills — flat radius pass */
  header button, .composer button, .ddbtn, .modelpill, #banner button { border-radius: 8px; }
  .ddpanel { border-radius: 12px; }
  .bubble, .msg.user .bubble, .msg.assistant .bubble { border-radius: 12px; }
  .msg.assistant .bubble { padding: 12px 14px; }
  details.thinking, details.tool, .assistant pre, .attach .filechip, .chip { border-radius: 8px; }
  pre .copy { border-radius: 6px; }
  .attach img, .attach video { border-radius: 8px; }
  .composer { border-radius: 12px; }
  .dropzone { border-radius: 12px; }

  /* Status chip */
  #status { display: none; font-size: 11.5px; letter-spacing: 0.3px; width: max-content;
            padding: 5px 12px; margin: 0 2px 8px; border: 1px solid var(--frost-alt);
            border-radius: 6px; background: var(--tint); color: var(--green); }
  #status.on { display: inline-flex; align-items: center; gap: 7px; }
  #status.retry { color: var(--yellow); }
  .dots { display: inline-flex; gap: 3px; align-items: center; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--green);
            animation: bounce 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .35; } 30% { transform: translateY(-4px); opacity: 1; } }
  .chip.queued { color: var(--yellow); border-color: rgba(255, 197, 61, 0.34); }
  .queuecard { align-self: flex-start; max-width: 94%; border: 1px dashed rgba(255, 197, 61, 0.5);
               background: rgba(255, 197, 61, 0.06); border-radius: 12px; padding: 10px 14px; }
  .queuecard .qhead { display: flex; align-items: center; gap: 8px; color: var(--yellow); font-size: 11px;
                      text-transform: uppercase; letter-spacing: 0.6px; }
  .qpulse { background: var(--yellow); }
  .queuecard .qrow { display: flex; align-items: baseline; gap: 9px; padding: 7px 0 2px; margin-top: 7px;
                     border-top: 1px solid var(--frost-alt); font-size: 13.5px; color: var(--text); }
  .queuecard .qnum { color: var(--yellow); font-family: var(--mono); font-size: 11px; flex: 0 0 auto; }
  .queuecard .qtxt { flex: 1; word-break: break-word; white-space: pre-wrap; }
  .queuecard .qdel { background: none; border: 0; color: var(--red); cursor: pointer; font-size: 14px;
                     padding: 0 2px; flex: 0 0 auto; font-family: var(--sans); }
  .queuecard .qdel:hover { color: #ff6b85; }

  /* Composer vertical centering + project chips */
  .composer { align-items: center; }
  .composer button#attach { font-size: 18px; padding: 8px 16px; line-height: 1; }
  .prow { display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; }
  .pchip { flex: 0 0 auto; border: 1px solid var(--frost); background: transparent; color: var(--dim);
           border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: var(--sans); }
  .pchip.active { color: var(--green); border-color: rgba(17, 255, 153, 0.34); }
  .pchip:hover { background: var(--hover); }
</style>
</head>
<body>
<header id="hdr">
  <div class="hrow">
    <span class="brand">opencode <em>remote</em></span>
    <button id="new" title="New session">＋</button>
    <button id="stop" class="stop" title="Abort current run">■ Stop</button>
  </div>
  <div class="hrow">
    <button id="sessionBtn" class="ddbtn grow3" title="Switch session">
      <span class="ddlabel">Session</span>
      <span class="ddvalue"><span id="sessionCur">Loading…</span><span class="chev"> ▼</span></span>
    </button>
    <button id="agentBtn" class="ddbtn grow2" title="Switch agent">
      <span class="ddlabel">Agent</span>
      <span class="ddvalue"><span id="agentCur">build</span><span class="chev"> ▼</span></span>
    </button>
  </div>
  <div class="hrow">
    <span id="modelPill" class="modelpill" title="Model is managed by opencode to avoid wrong-model fees">
      <span class="ddlabel">Model</span><span id="modelCur">…</span>
    </span>
  </div>
  <div id="ddPanel" class="ddpanel"></div>
</header>
<div id="banner"></div>
<div id="scroller"><div id="msgs"></div></div>
<footer>
  <div class="foot-inner">
    <div id="status"></div>
    <div id="chips"></div>
    <div class="composer">
      <button id="attach" class="ghost" title="Attach files">＋</button>
      <textarea id="input" rows="1" placeholder="Message, /command or !shell"></textarea>
      <button id="send">Send</button>
    </div>
    <input type="file" id="file" multiple>
  </div>
</footer>
<script>
  var TOKEN = __TOKEN__;
  var apiQS = TOKEN ? (window.location.search.indexOf("token=") >= 0 ? window.location.search.replace(/^[?&]/, "") : "token=" + encodeURIComponent(TOKEN)) : "";
  function jsonReq(path, opts) {
    var sep = path.indexOf("?") >= 0 ? "&" : "?";
    return fetch(path + sep + apiQS, Object.assign({ headers: { "content-type": "application/json" } }, opts || {}));
  }
  var hdr = document.getElementById("hdr");
  var sessionBtn = document.getElementById("sessionBtn");
  var agentBtn = document.getElementById("agentBtn");
  var sessionCur = document.getElementById("sessionCur");
  var agentCur = document.getElementById("agentCur");
  var modelCur = document.getElementById("modelCur");
  var ddPanel = document.getElementById("ddPanel");
  var scroller = document.getElementById("scroller");
  var msgs = document.getElementById("msgs");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var fileInput = document.getElementById("file");
  var chips = document.getElementById("chips");
  var banner = document.getElementById("banner");
  var statusEl = document.getElementById("status");
  var current = null, currentTitle = null, lastSig = {};
  var agent = "build";
  var sessionList = [], agentList = [];
  var projects = [], activeProject = null;
  var attachments = [];
  var stick = true;

  function atBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80; }
  scroller.addEventListener("scroll", function () { stick = atBottom(); });
  function scroll() { if (stick) scroller.scrollTop = scroller.scrollHeight; }

  function relTime(t) {
    if (!t) return "";
    var d = Math.max(0, Date.now() - t), m = Math.floor(d / 60000);
    if (m < 1) return "now";
    if (m < 60) return m + "m";
    var h = Math.floor(m / 60);
    if (h < 24) return h + "h";
    return Math.floor(h / 24) + "d";
  }

  function renderMd(el, text) {
    if (window.marked && window.DOMPurify) {
      try { el.innerHTML = window.DOMPurify.sanitize(window.marked.parse(text)); enhance(el); return; } catch (e) {}
    }
    var p = document.createElement("span");
    p.style.whiteSpace = "pre-wrap";
    p.textContent = text;
    el.appendChild(p);
  }

  function enhance(root) {
    root.querySelectorAll("pre").forEach(function (pre) {
      if (pre.querySelector(".copy")) return;
      var btn = document.createElement("button");
      btn.className = "copy";
      btn.textContent = "copy";
      btn.addEventListener("click", function () {
        navigator.clipboard.writeText(pre.innerText.replace(/^copy\n?/, "")).then(function () {
          btn.textContent = "copied ✓";
          setTimeout(function () { btn.textContent = "copy"; }, 1200);
        });
      });
      pre.appendChild(btn);
    });
  }

  function msgDom(m) {
    var wrap = document.createElement("div");
    var toolsOnly = m.segments.length > 0 && m.segments.every(function (s) { return s.type === "tool"; });
    wrap.className = "msg " + m.role + (toolsOnly && m.role === "assistant" ? " tools-only" : "");

    var who = document.createElement("div");
    who.className = "who";
    var name = document.createElement("span");
    name.className = "name";
    var when = document.createElement("span");
    when.textContent = relTime(m.time);
    if (m.role === "user") { name.textContent = "You"; }
    else {
      name.textContent = "✦ " + (m.model ? m.model.split("/").slice(1).join("/") : "opencode");
      if (m.cost > 0) {
        var cost = document.createElement("span");
        cost.className = "cost";
        cost.textContent = "$" + m.cost.toFixed(4);
        who.appendChild(cost);
      }
    }
    who.appendChild(name);
    who.appendChild(when);
    wrap.appendChild(who);

    var bubble = document.createElement("div");
    bubble.className = "bubble";
    m.segments.forEach(function (seg) {
      if (seg.type === "thinking") {
        var det = document.createElement("details");
        det.className = "thinking";
        if (seg.streaming) det.open = true;
        var sum = document.createElement("summary");
        if (seg.streaming) {
          var dot = document.createElement("span");
          dot.className = "pulse";
          sum.appendChild(dot);
        }
        var lbl = document.createElement("span");
        lbl.textContent = seg.streaming ? "Thinking…" : "Thought process";
        sum.appendChild(lbl);
        var chev = document.createElement("span");
        chev.className = "chev";
        chev.textContent = "▶";
        sum.appendChild(chev);
        det.appendChild(sum);
        var body = document.createElement("div");
        body.className = "tbody";
        body.textContent = seg.text;
        det.appendChild(body);
        bubble.appendChild(det);
      } else if (seg.type === "tool") {
        var det = document.createElement("details");
        det.className = "tool";
        var sum = document.createElement("summary");
        var tn = document.createElement("span");
        tn.className = "tname";
        tn.textContent = "⚙ " + seg.name;
        sum.appendChild(tn);
        var ch = document.createElement("span");
        ch.className = "chev";
        ch.textContent = seg.text ? "▼" : "";
        sum.appendChild(ch);
        det.appendChild(sum);
        if (seg.text) {
          var td = document.createElement("div");
          td.className = "tdetail";
          td.textContent = seg.text;
          det.appendChild(td);
        }
        bubble.appendChild(det);
      } else if (m.role === "assistant") {
        renderMd(bubble, seg.text);
      } else {
        var p = document.createElement("span");
        p.style.whiteSpace = "pre-wrap";
        p.textContent = seg.text;
        bubble.appendChild(p);
      }
    });
    wrap.appendChild(bubble);

    if (m.attachments.length) {
      var box = document.createElement("div");
      box.className = "attach";
      m.attachments.forEach(function (a) {
        if (a.mime && a.mime.indexOf("image/") === 0) {
          var img = document.createElement("img");
          img.src = a.url; img.alt = a.name; img.loading = "lazy";
          box.appendChild(img);
        } else if (a.mime && a.mime.indexOf("video/") === 0) {
          var vid = document.createElement("video");
          vid.src = a.url; vid.controls = true; vid.preload = "metadata";
          box.appendChild(vid);
        } else {
          var chip = document.createElement("a");
          chip.className = "filechip";
          chip.href = a.url; chip.textContent = "📄 " + a.name;
          box.appendChild(chip);
        }
      });
      wrap.appendChild(box);
    }
    return wrap;
  }

  function emptyDom() {
    var div = document.createElement("div");
    div.className = "empty";
    var logo = document.createElement("div");
    logo.className = "logo";
    logo.textContent = "⌥";
    var h = document.createElement("h1");
    h.textContent = "opencode remote";
    var p = document.createElement("p");
    p.textContent = "Send a message to start a new session";
    var hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "Markdown replies · /commands · !shell · paste or attach images & video";
    div.appendChild(logo); div.appendChild(h); div.appendChild(p); div.appendChild(hint);
    return div;
  }

  function renderBanner(perms, pendingOther) {
    if (!perms.length) {
      if (pendingOther > 0) {
        banner.style.display = "flex";
        banner.textContent = "";
        var info = document.createElement("span");
        info.textContent = "⏳ " + pendingOther + " permission" + (pendingOther > 1 ? "s" : "") +
          " pending in other session" + (pendingOther > 1 ? "s" : "") + " — open that session in the Session dropdown to respond";
        banner.appendChild(info);
      } else {
        banner.style.display = "none";
        banner.textContent = "";
      }
      return;
    }
    var p = perms[0];
    banner.style.display = "flex";
    banner.textContent = "";
    var label = document.createElement("span");
    label.textContent = "⚠ Permission [" + p.type + "]: " + p.title;
    banner.appendChild(label);
    [["once", "Allow once"], ["always", "Always allow"], ["reject", "Deny"]].forEach(function (r) {
      var b = document.createElement("button");
      b.textContent = r[1];
      b.className = r[0];
      b.addEventListener("click", function () {
        jsonReq("/api/permissions?directory=" + encodeURIComponent(activeProject || ""), { method: "POST", body: JSON.stringify({ sessionID: current, permissionID: p.id, response: r[0] }) });
      });
      banner.appendChild(b);
    });
  }

  function fmtK(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1000) return (n / 1000).toFixed(1) + "K";
    return String(Math.round(n));
  }

  function turnSumDom(group) {
    var cost = 0, tin = 0, tout = 0, tcache = 0, hasA = false, lastA = null;
    group.forEach(function (m) {
      if (m.role !== "assistant") return;
      hasA = true;
      cost += m.cost;
      tin += m.tokens.input;
      tout += m.tokens.output;
      tcache += m.tokens.cacheRead;
      lastA = m;
    });
    if (!hasA) return null;
    var ctx = lastA ? lastA.tokens.input + lastA.tokens.cacheRead : 0;
    var div = document.createElement("div");
    div.className = "turnsum";
    function part(html, cls) {
      var s = document.createElement("span");
      if (cls) s.className = cls;
      s.innerHTML = html;
      div.appendChild(s);
    }
    part("<b>" + "$" + cost.toFixed(4) + "</b>", "c");
    part("↑ <b>" + fmtK(tin) + "</b>" + (tcache > 0 ? " <span>(+" + fmtK(tcache) + " cache)</span>" : ""));
    part("↓ <b>" + fmtK(tout) + "</b>");
    part("ctx <b>" + fmtK(ctx) + "</b>");
    return div;
  }

  function renderState(st) {
    var sig = JSON.stringify(st.messages.map(function (m) {
      return [m.id, JSON.stringify(m.segments).length, m.cost, m.attachments.length];
    })) + "|" + st.status + "|" + JSON.stringify(st.permissions.map(function (p) { return p.id; })) + "|" + (st.pendingOther || 0);
    if (lastSig[current] === sig) return;
    lastSig[current] = sig;
    stick = atBottom();
    msgs.textContent = "";
    if (!st.messages.length) { msgs.appendChild(emptyDom()); }
    // Group messages into turns (user prompt + its assistant/tool messages)
    // and print a cost/token summary after each completed turn.
    var turns = [];
    st.messages.forEach(function (m) {
      if (m.role === "user" || !turns.length) turns.push([]);
      turns[turns.length - 1].push(m);
    });
    turns.forEach(function (group, idx) {
      group.forEach(function (m) { msgs.appendChild(msgDom(m)); });
      if (idx === turns.length - 1 && st.status !== "idle") return; // turn still running
      var sum = turnSumDom(group);
      if (sum) msgs.appendChild(sum);
    });
    for (var i = st.messages.length - 1; i >= 0; i--) {
      if (st.messages[i].role === "assistant" && st.messages[i].model) {
        modelCur.textContent = st.messages[i].model.split("/").slice(1).join("/");
        break;
      }
    }
    scroll();
    appendQueue();
    renderBanner(st.permissions, st.pendingOther || 0);
    var lastTool = "";
    for (var i = st.messages.length - 1; i >= 0 && !lastTool; i--) {
      var segs = st.messages[i].segments;
      for (var j = segs.length - 1; j >= 0; j--) {
        if (segs[j].type === "tool") { lastTool = segs[j].name; break; }
      }
    }
    statusEl.className = st.status === "retry" ? "on retry" : st.status === "busy" ? "on" : "";
    statusEl.innerHTML = st.status === "busy"
      ? '<span class="dots"><i></i><i></i><i></i></span> Working' + (lastTool ? " · " + lastTool : "") + "…"
      : st.status === "retry"
        ? '<span class="dots"><i></i><i></i><i></i></span> Retrying…'
        : "";
    appendQueue();
  }

  function poll() {
    if (!current) { msgs.textContent = ""; msgs.appendChild(emptyDom()); renderBanner([], 0); statusEl.className = ""; statusEl.innerHTML = ""; return; }
    jsonReq("/api/state?sessionID=" + encodeURIComponent(current) + "&directory=" + encodeURIComponent(activeProject || ""))
      .then(function (r) { return r.json(); })
      .then(renderState)
      .catch(function () {});
  }

  // ---- SSE live events: trigger instant refreshes, poll stays as fallback ----
  var lastTrigger = 0;
  function schedulePoll(force) {
    var now = Date.now();
    if (!force && now - lastTrigger < 250) return;
    lastTrigger = now;
    poll();
  }
  function startSSE() {
    if (!window.EventSource) return;
    var es = new EventSource("/api/events" + (apiQS ? "?" + apiQS : ""));
    es.onmessage = function (e) {
      try {
        var evt = JSON.parse(e.data);
        if (evt.type === "session.idle" && evt.sessionID === current) setTimeout(flushQueue, 600);
        if (evt.sessionID && evt.sessionID !== current && evt.type.indexOf("permission") !== 0) return;
        schedulePoll(evt.type === "session.idle" || evt.type === "permission.updated");
      } catch (err) {}
    };
    es.onerror = function () { /* EventSource auto-reconnects; polling covers gaps */ };
  }

  function setSession(id, title) {
    current = id || null;
    currentTitle = title || null;
    sessionCur.textContent = title || "New session";
    lastSig = {};
    closeDD();
    poll();
  }

  function loadProjects(thenRun) {
    jsonReq("/api/projects").then(function (r) { return r.json(); }).then(function (list) {
      projects = list || [];
      if (!projects.some(function (p) { return p.directory === activeProject; })) {
        activeProject = projects.length ? projects[0].directory : null;
      }
      if (thenRun) thenRun();
    }).catch(function () { if (thenRun) thenRun(); });
  }

  function refreshSessions(keepId) {
    jsonReq("/api/sessions?directory=" + encodeURIComponent(activeProject || "")).then(function (r) { return r.json(); }).then(function (list) {
      sessionList = list || [];
      var found = null;
      var wanted = keepId !== undefined ? keepId : current;
      sessionList.forEach(function (s) { if (s.id === wanted) found = s; });
      // No explicit target (project switch / startup): auto-open the most
      // recent session — that's the one likely running.
      if (!found && keepId === undefined && sessionList.length) found = sessionList[0];
      setSession(found ? found.id : null, found ? found.title : null);
    });
  }

  // ---- Accordion dropdowns ----
  function closeDD() { ddPanel.classList.remove("open"); ddPanel.innerHTML = ""; }
  function renderSessionPanel() {
    ddPanel.dataset.kind = "session";
    ddPanel.textContent = "";
    var head = document.createElement("div");
    head.className = "ddhead";
    head.textContent = "Projects";
    ddPanel.appendChild(head);

    var prow = document.createElement("div");
    prow.className = "prow";
    projects.forEach(function (p) {
      var chip = document.createElement("button");
      chip.className = "pchip" + (p.directory === activeProject ? " active" : "");
      chip.textContent = p.name;
      chip.title = p.sessions + " session" + (p.sessions === 1 ? "" : "s");
      chip.addEventListener("click", function () {
        if (activeProject === p.directory) return;
        activeProject = p.directory;
        loadMeta();
        refreshSessions();
      });
      prow.appendChild(chip);
    });
    ddPanel.appendChild(prow);

    var activeName = (projects.find(function (p) { return p.directory === activeProject; }) || {}).name || "project";
    var head2 = document.createElement("div");
    head2.className = "ddhead";
    head2.textContent = "Sessions in " + activeName;
    ddPanel.appendChild(head2);

    var newRow = document.createElement("div");
    newRow.className = "dditem" + (current ? "" : " active");
    newRow.innerHTML = '<span class="t">＋ New session</span>';
    newRow.addEventListener("click", function () { setSession(null, null); });
    ddPanel.appendChild(newRow);

    sessionList.forEach(function (s) {
      var item = document.createElement("div");
      item.className = "dditem" + (s.id === current ? " active" : "");
      var t = document.createElement("span");
      t.className = "t";
      t.textContent = s.title || s.id;
      var sub = document.createElement("span");
      sub.className = "sub";
      sub.textContent = relTime(s.updated) + " ago · " + s.id.slice(-6);
      item.appendChild(t); item.appendChild(sub);
      item.addEventListener("click", function () { setSession(s.id, s.title); });
      ddPanel.appendChild(item);
    });
    ddPanel.classList.add("open");
  }

  function toggleDD(kind) {
    if (ddPanel.classList.contains("open") && ddPanel.dataset.kind === kind) { closeDD(); return; }
    ddPanel.textContent = "";
    if (kind === "session") { renderSessionPanel(); return; }
    ddPanel.dataset.kind = kind;
    var head = document.createElement("div");
    head.className = "ddhead";
    head.textContent = "Agents — tap to switch";
    ddPanel.appendChild(head);
    agentList.forEach(function (a) {
      var item = document.createElement("div");
      item.className = "dditem" + (a.name === agent ? " active" : "");
      var t = document.createElement("span");
      t.className = "t";
      t.textContent = a.name;
      var sub = document.createElement("span");
      sub.className = "sub";
      sub.textContent = a.description || a.mode || "";
      item.appendChild(t); item.appendChild(sub);
      item.addEventListener("click", function () {
        agent = a.name;
        agentCur.textContent = a.name;
        closeDD();
      });
      ddPanel.appendChild(item);
    });
    ddPanel.classList.add("open");
  }
  sessionBtn.addEventListener("click", function (e) { e.stopPropagation(); toggleDD("session"); });
  agentBtn.addEventListener("click", function (e) { e.stopPropagation(); toggleDD("agent"); });
  document.addEventListener("click", function (e) {
    if (!ddPanel.contains(e.target)) closeDD();
  });

  function loadMeta() {
    jsonReq("/api/meta?directory=" + encodeURIComponent(activeProject || "")).then(function (r) { return r.json(); }).then(function (meta) {
      agentList = meta.agents || [];
      if (!agentList.some(function (a) { return a.name === agent; })) {
        agent = meta.defaultAgent || agentList[0]?.name || "build";
      }
      agentCur.textContent = agent;
      if (meta.defaultModel) modelCur.textContent = meta.defaultModel.split("/").slice(1).join("/");
    }).catch(function () {});
  }

  function addChips() {
    chips.textContent = "";
    attachments.forEach(function (a, i) {
      var chip = document.createElement("span");
      chip.className = "chip";
      if (a.dataUrl && a.mime.indexOf("image/") === 0) {
        var img = document.createElement("img");
        img.src = a.dataUrl;
        chip.appendChild(img);
      }
      var label = document.createElement("span");
      label.textContent = a.name;
      chip.appendChild(label);
      var x = document.createElement("button");
      x.textContent = "×";
      x.addEventListener("click", function () { attachments.splice(i, 1); addChips(); });
      chip.appendChild(x);
      chips.appendChild(chip);
    });
  }

  var queue = [];
  var queueDom = null;

  function appendQueue() {
    if (queueDom) { queueDom.remove(); queueDom = null; }
    if (!queue.length || !current) return;
    queueDom = document.createElement("div");
    queueDom.className = "queuecard";

    var head = document.createElement("div");
    head.className = "qhead";
    var dot = document.createElement("span");
    dot.className = "pulse qpulse";
    head.appendChild(dot);
    var lbl = document.createElement("span");
    lbl.textContent = "Queued · " + queue.length + " message" + (queue.length > 1 ? "s" : "") +
      " — sends when the agent finishes";
    head.appendChild(lbl);
    queueDom.appendChild(head);

    queue.forEach(function (p, i) {
      var row = document.createElement("div");
      row.className = "qrow";
      var num = document.createElement("span");
      num.className = "qnum";
      num.textContent = (i + 1) + ".";
      var txt = document.createElement("span");
      txt.className = "qtxt";
      txt.textContent = p.text || "📎 " + ((p.attachments && p.attachments[0] && p.attachments[0].name) || "attachment");
      var x = document.createElement("button");
      x.className = "qdel";
      x.textContent = "×";
      x.title = "Remove from queue";
      x.addEventListener("click", function () { queue.splice(i, 1); appendQueue(); });
      row.appendChild(num); row.appendChild(txt); row.appendChild(x);
      queueDom.appendChild(row);
    });
    msgs.appendChild(queueDom);
    scroll();
  }

  function doSend(payload) {
    sendBtn.disabled = true;
    jsonReq("/api/send?directory=" + encodeURIComponent(activeProject || ""), { method: "POST", body: JSON.stringify(payload) })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (res) {
        if (!res.ok) {
          if (res.b && res.b.error && res.b.error.indexOf("busy") >= 0) {
            queue.push(payload);
            appendQueue();
          } else {
            alert(res.b.error || "send failed");
          }
        }
        else {
          if (current !== res.b.sessionID) refreshSessions(res.b.sessionID);
          else setTimeout(poll, 250);
        }
      })
      .catch(function () { alert("network error"); })
      .finally(function () { sendBtn.disabled = false; });
  }

  function flushQueue() {
    if (!queue.length || !current) return;
    var next = queue.shift();
    appendQueue();
    doSend(next);
  }

  function send() {
    var text = input.value.trim();
    if (!text && !attachments.length) return;
    var payload = {
      sessionID: current,
      directory: activeProject,
      text: text,
      agent: agent,
      attachments: attachments.map(function (a) { return { name: a.name, mime: a.mime, data: a.b64 }; })
    };
    input.value = "";
    input.style.height = "auto";
    attachments = []; addChips();
    doSend(payload);
  }

  function addFile(f) {
    var reader = new FileReader();
    reader.onload = function () {
      var result = String(reader.result || "");
      var comma = result.indexOf(",");
      attachments.push({ name: f.name || "pasted-" + Date.now() + ".png", mime: f.type || "application/octet-stream", b64: comma >= 0 ? result.slice(comma + 1) : result, dataUrl: result });
      addChips();
    };
    reader.readAsDataURL(f);
  }

  fileInput.addEventListener("change", function () {
    Array.prototype.forEach.call(fileInput.files, addFile);
    fileInput.value = "";
  });
  document.getElementById("attach").addEventListener("click", function () { fileInput.click(); });

  // Ctrl+V / long-press paste — works over http; images arrive as file items.
  document.addEventListener("paste", function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var added = false;
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file") {
        var f = items[i].getAsFile();
        if (f) { addFile(f); added = true; }
      }
    }
    if (added) e.preventDefault();
  });

  // Drag & drop files onto the chat area.
  var dropTimer = null;
  window.addEventListener("dragover", function (e) { e.preventDefault(); scroller.classList.add("dropzone"); clearTimeout(dropTimer); dropTimer = setTimeout(function () { scroller.classList.remove("dropzone"); }, 300); });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    scroller.classList.remove("dropzone");
    if (e.dataTransfer && e.dataTransfer.files) Array.prototype.forEach.call(e.dataTransfer.files, addFile);
  });

  document.getElementById("new").addEventListener("click", function () { setSession(null, null); input.focus(); });
  document.getElementById("stop").addEventListener("click", function () {
    if (current) jsonReq("/api/abort?directory=" + encodeURIComponent(activeProject || ""), { method: "POST", body: JSON.stringify({ sessionID: current }) });
  });
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  loadProjects(function () {
    loadMeta();
    refreshSessions();
  });
  startSSE();
  setInterval(poll, 1500);
</script>
</body>
</html>
